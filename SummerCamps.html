<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mountmellick Summer Camps</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #333;
      transition: direction 0.3s;
    }

    header {
      background: #2c7be5;
      color: white;
      padding: 20px;
      text-align: center;
    }

    h1 { margin: 0; }

    .container {
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    select, button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
      background: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .tag {
      display: inline-block;
      background: #e1ecff;
      color: #2c7be5;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 12px;
      margin-top: 5px;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #777;
    }

    /* MAP MODAL */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
    }

    .modal-content {
      background: white;
      width: 90%;
      max-width: 900px;
      height: 80%;
      margin: 5% auto;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      cursor: pointer;
      z-index: 10;
      background: white;
      padding: 5px 10px;
      border-radius: 5px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 600px) {
      header { padding: 15px; }
      .modal-content { height: 70%; }
    }
  </style>
</head>
<body>

<header>
  <h1 id="title">Mountmellick Summer Camps</h1>
  <p id="subtitle">Find the best camps for children and young people</p>
</header>

<div class="container">

  <div class="top-bar">
    <div class="filters">
      <select id="typeFilter">
        <option value="all">All Types</option>
        <option value="sport">Sport</option>
        <option value="outdoor">Outdoor</option>
        <option value="creative">Creative</option>
      </select>
    </div>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button onclick="setLanguage('en')">English</button>
      <button onclick="setLanguage('ar')">العربية</button>
      <button onclick="openMap()">📍 Map</button>
    </div>
  </div>

  <div class="grid" id="campGrid"></div>

</div>

<footer id="footer">
  © 2026 Summer Camps Mountmellick
</footer>

<!-- MAP MODAL -->
<div id="mapModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeMap()">✖</span>
    <iframe
      src="https://www.google.com/maps?q=Mountmellick,Ireland&output=embed"
      loading="lazy">
    </iframe>
  </div>
</div>

<a href="index.html" id="navLaptop">دليل المهاجرين في بورتلاويز</a>
<script>
  let currentLang = 'en';

  const translations = {
    en: {
      title: "Mountmellick Summer Camps",
      subtitle: "Find the best camps for children and young people",
      all: "All Types",
      sport: "Sport",
      outdoor: "Outdoor",
      creative: "Creative",
      location: "Location"
    },
    ar: {
      title: "مخيمات الصيف في ماونتمليك",
      subtitle: "اعثر على أفضل المخيمات للأطفال والشباب",
      all: "كل الأنواع",
      sport: "رياضة",
      outdoor: "أنشطة خارجية",
      creative: "إبداعي",
      location: "الموقع"
    }
  };

  const camps = [
    { name: { en: "Tennis Camp", ar: "معسكر التنس" }, location: { en: "Mountmellick", ar: "ماونتمليك" }, type: "sport", desc: { en: "Fun tennis training and games for ages 6–16.", ar: "تدريب ممتع على التنس وألعاب للأعمار 6-16." } },
    { name: { en: "Community Sports Camp", ar: "معسكر الرياضة المجتمعي" }, location: { en: "Mountmellick", ar: "ماونتمليك" }, type: "sport", desc: { en: "Multi-sport activities and games.", ar: "أنشطة رياضية متنوعة وألعاب." } },
    { name: { en: "Forest School", ar: "مدرسة الغابة" }, location: { en: "Laois", ar: "لاويس" }, type: "outdoor", desc: { en: "Nature play and outdoor learning.", ar: "اللعب في الطبيعة والتعلم في الهواء الطلق." } },
    { name: { en: "Farm Camp", ar: "معسكر المزرعة" }, location: { en: "Laois", ar: "لاويس" }, type: "outdoor", desc: { en: "Animal interaction and outdoor fun.", ar: "التفاعل مع الحيوانات وأنشطة خارجية ممتعة." } },
    { name: { en: "Adventure Camp", ar: "معسكر المغامرات" }, location: { en: "Midlands", ar: "الميدلاندز" }, type: "outdoor", desc: { en: "Kayaking and climbing activities.", ar: "أنشطة التجديف والتسلق." } },
    { name: { en: "Campa Craic", ar: "كامبا كريك" }, location: { en: "Midlands", ar: "الميدلاندز" }, type: "creative", desc: { en: "Sports, arts, and games.", ar: "رياضة وفنون وألعاب." } },
    { name: { en: "Starcamp", ar: "ستاركامب" }, location: { en: "Ireland", ar: "أيرلندا" }, type: "creative", desc: { en: "Singing, dancing, and drama.", ar: "غناء ورقص وتمثيل." } }
  ];

  const grid = document.getElementById("campGrid");
  const filter = document.getElementById("typeFilter");

  function displayCamps(type) {
    grid.innerHTML = "";
    const filtered = type === "all" ? camps : camps.filter(c => c.type === type);

    filtered.forEach(camp => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <h3>${camp.name[currentLang]}</h3>
        <p><strong>${translations[currentLang].location}:</strong> ${camp.location[currentLang]}</p>
        <p>${camp.desc[currentLang]}</p>
        <span class="tag">${translations[currentLang][camp.type]}</span>
      `;

      grid.appendChild(card);
    });
  }

  function setLanguage(lang) {
    currentLang = lang;
    document.body.style.direction = lang === 'ar' ? 'rtl' : 'ltr';

    document.getElementById("title").innerText = translations[lang].title;
    document.getElementById("subtitle").innerText = translations[lang].subtitle;

    filter.options[0].text = translations[lang].all;
    filter.options[1].text = translations[lang].sport;
    filter.options[2].text = translations[lang].outdoor;
    filter.options[3].text = translations[lang].creative;

    displayCamps(filter.value);
  }

  function openMap() {
    document.getElementById("mapModal").style.display = "block";
  }

  function closeMap() {
    document.getElementById("mapModal").style.display = "none";
  }

  filter.addEventListener("change", () => {
    displayCamps(filter.value);
  });

  displayCamps("all");
</script>

</body>
</html>
